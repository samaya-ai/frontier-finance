# Example run config for `frontier-finance-grader --config eval.example.yaml`.

rubrics_path: data/rubrics.jsonl
responses_path: data/system_summaries.json
output_dir: grader_results/

judge_models:
  - claude-sonnet-4-6
  - gemini-3.1-pro-preview
  - gpt-5.4

max_rubrics_per_call: 30
concurrency: 8
max_tokens: 32000
request_timeout: 120.0
max_retries: 2

# Retries when a judge call succeeds but its body can't be parsed as JSON.
# The judge is re-prompted with a format reminder; 0 disables parse retries.
max_json_parse_retries: 1
